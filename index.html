<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Note Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Toolbar dei comandi (non esportata in PNG) -->
    <div class="mb-8 flex flex-wrap gap-4 no-export" id="main-toolbar">
        <button onclick="exportPDF()" class="btn-tab px-5 py-3 font-semibold text-sm">
            <span class="tab-strip" style="background:var(--ink)"></span>
            <i class="fa-solid fa-file-pdf mr-2"></i>Esporta PDF
        </button>
        <button onclick="saveJSON()" class="btn-tab px-5 py-3 font-semibold text-sm">
            <span class="tab-strip" style="background:var(--teal)"></span>
            <i class="fa-solid fa-floppy-disk mr-2"></i>Salva dati
        </button>
        <label class="btn-tab px-5 py-3 font-semibold text-sm cursor-pointer">
            <span class="tab-strip" style="background:var(--ink-soft)"></span>
            <i class="fa-solid fa-folder-open mr-2"></i>Carica dati
            <input type="file" accept=".json" class="hidden" id="file-input" onchange="loadJSON(event)">
        </label>
        <button onclick="openModal()" class="btn-tab px-5 py-3 font-semibold text-sm">
            <span class="tab-strip" style="background:var(--rust)"></span>
            <i class="fa-solid fa-trash mr-2"></i>Svuota tutto
        </button>
    </div>

    <!-- Area da esportare in immagine -->
    <div id="capture-area" class="w-full max-w-5xl relative pl-12" style="background:var(--card); border:2px solid var(--ink);" >
        <div class="hard-shadow absolute inset-0 -z-10" style="background:var(--card); border:2px solid var(--ink);"></div>

        <!-- Dorso a quaderno -->
        <div class="absolute left-0 top-0 bottom-0 w-12 flex flex-col items-center justify-evenly py-8" style="border-right:1.5px solid var(--line);">
            <div class="spine-hole"></div>
            <div class="spine-hole"></div>
            <div class="spine-hole"></div>
            <div class="spine-hole"></div>
            <div class="spine-hole"></div>
        </div>

        <div class="p-8 pl-6">
            <!-- Header: Immagine e Titoli -->
            <div class="p-6 mb-6 flex gap-6 items-center card-container" style="border-bottom:1.5px solid var(--ink);">
                <!-- Box Immagine -->
                <div class="image-slot w-32 h-40 flex items-center justify-center relative group shrink-0 overflow-hidden">
                    <img id="main-image" src="" alt="" class="w-full h-full object-cover hidden">
                    <div id="image-placeholder" class="text-center text-sm p-2" style="color:var(--ink-soft)">
                        <i class="fa-solid fa-image mb-1 block text-lg"></i>Clicca per<br>immagine
                    </div>
                    <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="uploadImage(event)">
                    <button onclick="removeImage(event)" id="remove-image-btn" class="icon-btn absolute top-1 right-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity hidden no-export" style="background:var(--rust); color:var(--card); border-color:var(--ink);">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <!-- Box Testo Header -->
                <div class="flex-1 min-w-0">
                    <h1 id="main-title" contenteditable="true" data-placeholder="Inserisci Titolo Principale" class="font-display text-4xl font-semibold mb-2 outline-none break-words" onblur="updateState()"></h1>
                    <h2 id="main-subtitle" contenteditable="true" data-placeholder="Inserisci Sottotitolo o Date" class="text-lg italic outline-none break-words" style="color:var(--ink-soft)" onblur="updateState()"></h2>
                </div>
            </div>

            <!-- Griglia delle Sezioni -->
            <div id="sections-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-2">
                <!-- Le sezioni verranno renderizzate qui dal JavaScript -->
            </div>

            <!-- Pulsante Aggiungi Sezione (Nascosco nel PNG) -->
            <button onclick="addSection()" class="btn-tab mt-6 px-4 py-2 text-sm font-semibold flex items-center gap-2 no-export">
                <i class="fa-solid fa-plus"></i> Aggiungi nuova sezione
            </button>
        </div>
    </div>

    <!-- Modale Svuota Tutto -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50 px-4">
        <div class="hard-shadow p-7 max-w-md w-full text-center" style="background:var(--card); border:2px solid var(--ink);">
            <h3 class="font-display text-xl font-semibold mb-3">Svuotare l'area di lavoro?</h3>
            <p class="mb-6 text-sm" style="color:var(--ink-soft)">Tutti i dati non salvati andranno persi. Sei sicuro di voler continuare?</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeModal()" class="btn-tab px-4 py-2 font-semibold text-sm">Annulla</button>
                <button onclick="resetApp()" class="btn-tab px-4 py-2 font-semibold text-sm" style="background:var(--rust); color:var(--card);">Svuota tutto</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
